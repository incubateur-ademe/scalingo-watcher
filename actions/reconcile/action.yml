# Renovate fusionne le manifeste puis s'arrete. Il ne repasse jamais sur une app
# restee en arriere apres un echec ou une interruption, et il ne sait rien de ce
# qui tourne reellement. Cette execution periodique ferme la boucle : elle releve
# l'etat du parc, signale ce qui a bouge hors du watcher, puis converge.
#
# Une composite ne declare ni runs-on, ni environment, ni permissions, ni
# concurrency : le job appelant les porte. Son groupe de concurrence
# scalingo-apply, au niveau du job, est la seule garde contre deux convergences
# en parallele. L'action validate le controle dans les workflows du parc.
name: reconcilier le parc
description: >
  Releve l'etat reel du parc, fait converger chaque application vers le
  manifeste, consigne le lock et tient le tableau de bord. Le job appelant
  declare l'environment qui porte les secrets, les permissions contents: write
  et issues: write, et le groupe de concurrence scalingo-apply.

inputs:
  dry-run:
    description: >
      "true" pour relever et comparer sans rien deployer, "false" pour
      converger. Sans valeur par defaut : une cle mal orthographiee arrete le
      passage au lieu de deployer.
    required: true
  fgp-key:
    description: Cle du proxy FGP, lue avec fgp-path. Passer secrets.FGP_KEY, meme vide.
    required: true
  scalingo-api-token:
    description: Jeton de compte Scalingo, pour un acces direct. Passer secrets.SCALINGO_API_TOKEN, meme vide.
    required: true
  push-token:
    description: >
      Jeton qui recupere le depot et pousse le lock, pour une branche protegee.
      Passer secrets.PUSH_TOKEN, meme vide : vide, c'est le GITHUB_TOKEN du job.
    required: true
  teams-webhook:
    description: URL de webhook Teams. Passer secrets.TEAMS_WEBHOOK, meme vide.
    required: true
  slack-webhook:
    description: URL de webhook au format Slack. Passer secrets.SLACK_WEBHOOK, meme vide.
    required: true
  matrix-access-token:
    description: Jeton du compte bot Matrix. Passer secrets.MATRIX_ACCESS_TOKEN, meme vide.
    required: true
  heartbeat-url:
    description: >
      URL de battement d'un service de veille de silence (pulse updown.io ou
      equivalent), plusieurs separees par des blancs. Passer
      secrets.HEARTBEAT_URL, meme vide.
    required: true
  async:
    description: >
      "true" pour un passage qui rend la main, l'etat en vol dans le lock, la
      suite revenant au relais ou au cron. A n'activer qu'avec un relais.
    required: false
    default: "false"
  resume:
    description: >
      "true" pour faire avancer le deploiement en cours sans en ouvrir un : le
      passage que declenche le relais, par l'input resume du workflow_dispatch.
    required: false
    default: "false"
  matrix-homeserver:
    description: Serveur Matrix du compte bot qui notifie (Tchap ou autre)
    required: false
    default: ""
  matrix-room-id:
    description: Salon Matrix a prevenir aux changements d'etat
    required: false
    default: ""
  manifest-path:
    description: Chemin du manifeste, relatif a la racine du depot
    required: false
    default: manifest.yaml
  lock-path:
    description: Chemin du lock, relatif a la racine du depot
    required: false
    default: lock.json
  fgp-path:
    description: Chemin des blobs du proxy, relatif a la racine du depot
    required: false
    default: fgp.json
  dashboard-label:
    description: Label qui identifie l'issue du tableau de bord
    required: false
    default: etat-parc
  dashboard-title:
    description: Titre de l'issue du tableau de bord, a sa creation
    required: false
    default: "Parc Scalingo : etat de la convergence"
  lock-commit-message:
    description: Message du commit du lock
    required: false
    default: "chore(lock): etat du parc apres reconciliation"
  checkout:
    description: >
      "false" quand le job a deja recupere le depot du parc, a la tete de
      github.ref, avec un jeton qui peut pousser. Par defaut, l'action le
      recupere elle-meme avec push-token.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Les inputs d'une action sont des chaines et GitHub n'en impose aucun :
    # ce qui manque arrive vide, sans erreur.
    - name: controler les entrees
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        ASYNC: ${{ inputs.async }}
        RESUME: ${{ inputs.resume }}
        FGP_KEY: ${{ inputs.fgp-key }}
        SCALINGO_API_TOKEN: ${{ inputs.scalingo-api-token }}
      run: |
        set -euo pipefail
        case "$DRY_RUN" in
          true|false) ;;
          *)
            echo "::error::dry-run vaut '$DRY_RUN' : attendu true ou false, ecrit explicitement par l'appelant"
            exit 1
            ;;
        esac
        # Vide vaut false. Un cron ou un push n'ont pas d'inputs, et l'expression
        # inputs.resume de l'appelant y arrive vide.
        for pair in "async=$ASYNC" "resume=$RESUME"; do
          case "${pair#*=}" in
            true|false|"") ;;
            *)
              echo "::error::${pair%%=*} vaut '${pair#*=}' : attendu true ou false"
              exit 1
              ;;
          esac
        done
        if [ -z "$FGP_KEY" ] && [ -z "$SCALINGO_API_TOKEN" ]; then
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning::ni fgp-key ni scalingo-api-token : le plan ignore l'etat reel des apps. Le job declare-t-il l'environment qui porte les secrets ?"
          else
            echo "::error::ni fgp-key ni scalingo-api-token : aucun acces a Scalingo. Le job declare-t-il l'environment qui porte les secrets ?"
            exit 1
          fi
        fi
        if [ "$DRY_RUN" = "false" ] && ! command -v gh >/dev/null; then
          echo "::error::gh introuvable sur ce runner, il tient le tableau de bord. Les runners heberges par GitHub l'embarquent, l'image ghcr.io/actions/actions-runner non."
          exit 1
        fi

    # La tete de la branche, et non le commit de l'evenement : un passage mis en
    # file derriere un autre garde le sha de sa creation, et relirait un lock
    # d'avant ce que le precedent a lance. En asynchrone, il relancerait ce qui
    # est deja en vol.
    - if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.ref }}
        token: ${{ inputs.push-token || github.token }}

    - id: outil
      name: recuperer l'outil
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../copy-tool.sh"

    - uses: ./.scalingo-watcher/actions/setup

    # !cancelled() en plus du success() implicite : une annulation tombee entre
    # deux pas d'une composite ne marque pas toujours son statut, et le moteur
    # demarrerait alors sans pouvoir etre interrompu.
    - name: reconcilier
      if: ${{ success() && !cancelled() }}
      shell: bash
      env:
        SCALINGO_API_TOKEN: ${{ inputs.scalingo-api-token }}
        FGP_KEY: ${{ inputs.fgp-key }}
        GITHUB_TOKEN: ${{ github.token }}
        DRY_RUN: ${{ inputs.dry-run }}
        ASYNC: ${{ inputs.async }}
        RESUME: ${{ inputs.resume }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        LOCK_PATH: ${{ inputs.lock-path }}
        FGP_PATH: ${{ inputs.fgp-path }}
      run: |
        out="$RUNNER_TEMP/scalingo-watcher"
        mkdir -p "$out"
        args=(--reconcile --manifest "$MANIFEST_PATH" --lock "$LOCK_PATH" --fgp "$FGP_PATH" --out-dir "$out")
        if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        if [ "$ASYNC" = "true" ]; then args+=(--async); fi
        if [ "$RESUME" = "true" ]; then args+=(--resume); fi
        # Sans pipefail, le code retenu serait celui de tee : une convergence
        # en echec ressortait en vert.
        set -o pipefail
        node .scalingo-watcher/src/apply.ts "${args[@]}" | tee "$out/reconcile.log"

    # Le lock reflete ce qui a ete reellement deploye : il doit revenir dans le
    # depot meme quand une partie des applications a echoue, sinon la prochaine
    # execution repart d'un etat perime et redeploie ce qui est deja en place.
    # Comparaison de chaines : dans une composite, !inputs.dry-run vaudrait
    # toujours faux, 'false' etant une chaine non vide.
    - name: consigner le lock
      if: ${{ always() && steps.outil.outcome == 'success' && inputs.dry-run != 'true' }}
      uses: ./.scalingo-watcher/actions/commit-lock
      with:
        lock-path: ${{ inputs.lock-path }}
        message: ${{ inputs.lock-commit-message }}

    # Le moteur n'ecrit pas de rapport en plan, il n'y a donc rien a publier.
    - name: signaler
      id: signaler
      if: ${{ always() && steps.outil.outcome == 'success' && inputs.dry-run != 'true' }}
      uses: ./.scalingo-watcher/actions/signaler
      with:
        token: ${{ github.token }}
        teams-webhook: ${{ inputs.teams-webhook }}
        slack-webhook: ${{ inputs.slack-webhook }}
        matrix-homeserver: ${{ inputs.matrix-homeserver }}
        matrix-room-id: ${{ inputs.matrix-room-id }}
        matrix-token: ${{ inputs.matrix-access-token }}
        report-path: ${{ runner.temp }}/scalingo-watcher/incident.md
        label: ${{ inputs.dashboard-label }}
        title: ${{ inputs.dashboard-title }}

    # Les notifications partent de ce job. Quand il ne demarre plus
    # (facturation refusee, cron arrete), personne n'est prevenu. Le service
    # de veille alerte quand ces battements cessent. Un battement suit un
    # tableau de bord publie, donc un parc regarde. Seule la premiere
    # tentative d'un passage planifie bat. Un lancement a la main, ou la
    # relance d'un ancien run planifie, masquerait un cron arrete.
    # Un pas de composite n'accepte pas timeout-minutes : les bornes de curl
    # tiennent l'attente, groupe de concurrence tenu.
    - name: battement
      if: ${{ always() && github.event_name == 'schedule' && github.run_attempt == '1' && steps.signaler.outcome == 'success' && steps.signaler.outputs.state != 'skipped' }}
      shell: bash
      env:
        HEARTBEAT_URL: ${{ inputs.heartbeat-url }}
      run: |
        {
          echo "### Veille de silence"
          echo
        } >> "$GITHUB_STEP_SUMMARY"
        if [ -z "${HEARTBEAT_URL//[[:space:]]/}" ]; then
          echo "aucune veille de silence configuree : si ce workflow cesse de tourner, personne ne sera prevenu"
          echo "Aucune veille de silence configuree (secret HEARTBEAT_URL)." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # Sans set -f, un ? de l'URL serait developpe comme un motif de
        # fichier. Sans \r dans IFS, celui d'un secret colle avec des fins de
        # ligne Windows resterait au bout de l'URL, et curl la rejetterait.
        set -f
        IFS=$' \t\r\n'
        valid='^([A-Za-z0-9._-]+|\[[0-9A-Fa-f:.]+\])(:[0-9]+)?$'
        for url in $HEARTBEAT_URL; do
          # Identifiants, chemin et requete peuvent porter le secret du
          # service. Le runner ne masque que la valeur entiere du secret,
          # donc seul l'hote est affiche.
          host=${url#*://}
          host=${host%%[/?#]*}
          host=${host##*@}
          # Sur une URL mal formee, l'hote lu ici n'est plus celui que lit
          # curl, et l'un ou l'autre afficherait un morceau du secret.
          if [[ ! $host =~ $valid ]]; then
            echo "::warning::battement non envoye, une URL de HEARTBEAT_URL est mal formee"
            echo "Battement non envoye, une URL de HEARTBEAT_URL est mal formee." >> "$GITHUB_STEP_SUMMARY"
            continue
          fi
          # Sans -g, curl developpe [] et {} en plusieurs URL, et affiche
          # l'URL entiere quand le motif est invalide. -L suit une
          # redirection de http vers https jusqu'au service.
          # --retry-max-time borne l'attente qu'un Retry-After imposerait,
          # groupe de concurrence tenu. Quand ce Retry-After depasse la
          # borne, curl 8.18 renonce a reessayer et sort en 0. Seul un code
          # final en 2xx compte donc comme recu.
          if code=$(curl -gfsSL -o /dev/null -w '%{http_code}' -m 10 --retry 3 --retry-max-time 30 "$url") && [[ $code == 2?? ]]; then
            echo "battement recu par $host"
            echo "Battement recu par $host." >> "$GITHUB_STEP_SUMMARY"
          else
            # Le parc a ete regarde, le job reste vert. Un battement qui
            # manque durablement fait lever l'alerte.
            echo "::warning::battement refuse ou perdu par $host"
            echo "Battement refuse ou perdu par $host." >> "$GITHUB_STEP_SUMMARY"
          fi
        done

    - name: resume
      if: always()
      shell: bash
      run: |
        {
          echo "### Reconciliation"
          echo
          echo '```'
          tail -30 "$RUNNER_TEMP/scalingo-watcher/reconcile.log" 2>/dev/null || echo "aucune sortie"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
