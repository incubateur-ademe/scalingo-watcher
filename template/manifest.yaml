# yaml-language-server: $schema=https://raw.githubusercontent.com/incubateur-ademe/scalingo-watcher/v1.0.0/schema/manifest.schema.json
# Manifeste d'exemple : apps, depot applicatif et sha sont fictifs. Il est
# remplace par celui que genere init depuis l'etat reel du parc (README.md).
#
# Intention : ce qu'on veut voir tourner sur le parc.
# Ce que le parc fait reellement vit dans lock.json, ecrit par le moteur.
#
# L'ordre des entrees de `apps` EST l'ordre de deploiement, du moins critique au
# plus critique. La premiere sert d'eclaireur : si elle echoue, la vague s'arrete
# et les suivantes ne sont pas tentees.
#
# Les lignes d'annotation qui precedent `sha:` et `version:` ne sont pas
# decoratives : elles portent la datasource et le depName que Renovate lit via
# le preset base de scalingo-watcher. Les supprimer coupe la veille sur la
# ligne qui suit.

defaults:
  # Semantique Renovate apres le versioning de Metabase (preset metabase) :
  #   major = 2e chiffre Metabase (0.63 -> 0.64), une montee fonctionnelle
  #   minor = 3e chiffre Metabase (0.63.15 -> 0.63.16), un correctif
  policy:
    minor: auto
    major: pr
  backup: required

apps:
  - app: alpha-metabase
    region: osc-fr1
    # Base pilotee : un ecart avec le reel declenche une montee d'un cran,
    # precedee d'une sauvegarde. Le champ avance par pull request.
    database:
      version: 16.15.0-1
    source:
      repo: exemple/metabase-scalingo
      branch: main
      # renovate: datasource=git-refs depName=exemple/metabase-scalingo
      sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    tool:
      env: METABASE_VERSION
      # renovate: datasource=github-releases depName=metabase/metabase
      version: v0.63.18

  # Sans champ database, la base est seulement surveillee : une version plus
  # recente disponible est signalee, rien n'est monte.
  - app: beta-metabase
    region: osc-secnum-fr1
    source:
      repo: exemple/metabase-scalingo
      branch: main
      # renovate: datasource=git-refs depName=exemple/metabase-scalingo
      sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    tool:
      env: METABASE_VERSION
      # renovate: datasource=github-releases depName=metabase/metabase
      version: v0.63.18
