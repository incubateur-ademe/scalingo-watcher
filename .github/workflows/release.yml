# Chaque push sur main tient a jour la pull request de release. Sa fusion cree
# le tag vX.Y.Z et la release, puis le tag majeur vX est deplace sur le meme
# commit pour ceux qui suivent la ligne majeure.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Une pull request ouverte avec le GITHUB_TOKEN ne declenche pas la CI :
      # RELEASE_TOKEN, quand il existe, ouvre la pull request de release.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: deplacer le tag majeur
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          MAJOR: ${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -f "v$MAJOR" "$SHA"
          git push -f origin "refs/tags/v$MAJOR"
