# Renovate ne peut pas suivre les failles de l'outil : installe par un buildpack
# depuis une variable d'environnement, il n'est une dependance d'aucun ecosysteme
# de paquets. Une alerte Dependabot exige un avis revu, rattache a l'un des
# ecosystemes supportes, et une dependance visible dans le graphe de dependances,
# or manifest.yaml n'est pas un manifeste reconnu ; osvVulnerabilityAlerts ne
# couvre qu'une dizaine de datasources de paquets. Le watcher releve donc
# lui-meme les avis du depot amont et ouvre la pull request qui porte la montee,
# comme il le fait pour les versions de bases.
#
# Workflow reutilisable : le cron et les permissions sont declares par le
# workflow appelant.
name: proposer les montees de securite

on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: manifest.yaml
      lock-path:
        type: string
        default: lock.json
      branch:
        description: Branche reutilisee d'un passage a l'autre pour porter la proposition
        type: string
        default: montee-securite
      commit-message:
        type: string
        default: "fix(securite): monter les versions couvertes par un avis amont"
    secrets:
      PUSH_TOKEN:
        required: false

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Aucun environment et aucun acces a Scalingo : le verdict se rend avec les
    # avis de l'amont et le manifeste. Ce passage n'a donc pas a pouvoir lire la
    # cle du proxy.
    #
    # Pas le verrou de la convergence : il ne touche ni le parc ni le lock.
    # Son propre groupe, deux propositions en parallele se disputant la meme
    # branche, poussee en force.
    concurrency:
      group: scalingo-watcher-propose-security
      cancel-in-progress: false
    env:
      MANIFEST_PATH: ${{ inputs.manifest-path }}
      LOCK_PATH: ${{ inputs.lock-path }}
    steps:
      # Une pull request ouverte avec le GITHUB_TOKEN ne declenche pas la
      # validation : PUSH_TOKEN, quand il existe, pousse la branche et ouvre la
      # pull request.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - name: recuperer l'outil
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .scalingo-watcher
          persist-credentials: false

      - uses: ./.scalingo-watcher/actions/setup

      - name: relever les avis de l'amont
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/scalingo-watcher"
          mkdir -p "$out"
          set -o pipefail
          node .scalingo-watcher/src/apply.ts --propose-security \
            --manifest "$MANIFEST_PATH" --lock "$LOCK_PATH" --out-dir "$out" \
            | tee "$out/propose.log"

      # Ce workflow ne tient pas le verrou de la convergence et ne commite que
      # le manifeste. Un lock modifie trahirait une convergence menee ici.
      - name: verifier que le parc n'a pas ete touche
        run: git diff --exit-code -- "$LOCK_PATH"

      - name: ouvrir la pull request
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
          BRANCH: ${{ inputs.branch }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/scalingo-watcher"
          if git diff --quiet -- "$MANIFEST_PATH"; then
            echo "aucune montee de securite a proposer"
            exit 0
          fi

          for f in pr-title.txt pr-body.md; do
            if [ ! -s "$out/$f" ]; then
              echo "::error::le manifeste a change mais le moteur n'a pas produit $out/$f"
              exit 1
            fi
          done

          # La pull request vise la branche executee : main pour le cron.
          base="$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "$MANIFEST_PATH"
          git commit -m "$COMMIT_MESSAGE"
          git push -f origin "$BRANCH"

          # Le titre et le corps sont reecrits a chaque passage : la branche
          # etant reutilisee, une pull request deja relue peut porter autre
          # chose, et son libelle doit dire ce qu'elle contient maintenant.
          title=$(cat "$out/pr-title.txt")
          pr_number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          # Sans `--label` : un label absent du depot consommateur ferait
          # echouer la creation, et c'est a lui de nommer les siens.
          if [ -z "$pr_number" ]; then
            gh pr create --head "$BRANCH" --base "$base" \
              --title "$title" --body-file "$out/pr-body.md"
          else
            gh pr edit "$pr_number" \
              --title "$title" --body-file "$out/pr-body.md"
            echo "pull request #$pr_number mise a jour"
          fi
