# Chaque push sur main tient a jour la pull request de release. Sa fusion cree
# le tag vX.Y.Z et la release, puis le tag majeur vX est deplace sur le meme
# commit pour ceux qui suivent la ligne majeure, et template/ est recopie dans le
# depot starter avec la version de la release.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Une pull request ouverte avec le GITHUB_TOKEN ne declenche pas la CI :
      # RELEASE_TOKEN, quand il existe, ouvre la pull request de release.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: deplacer le tag majeur
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          MAJOR: ${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -f "v$MAJOR" "$SHA"
          git push -f origin "refs/tags/v$MAJOR"

  # Le starter est un depot a part : un depot cree depuis lui en copie tous les
  # fichiers, un workflow de synchronisation y vivrait donc aussi chez chaque
  # consommateur. La copie part d'ici. Le GITHUB_TOKEN ne peut pas ecrire dans
  # un autre depot ni y modifier des workflows : TEMPLATE_SYNC_TOKEN est un PAT
  # fine-grained limite au starter, droits Contents et Workflows en ecriture.
  sync-template:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEMPLATE_REPOSITORY: incubateur-ademe/scalingo-parc-template
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::TEMPLATE_SYNC_TOKEN absent : $TEMPLATE_REPOSITORY n'est pas synchronise avec $TAG"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.token.outputs.present == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          path: tool
          persist-credentials: false

      - if: ${{ steps.token.outputs.present == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TEMPLATE_REPOSITORY }}
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          path: starter

      # template/ ne porte aucune version de l'outil, seulement un repere : la
      # recopie le remplace par le tag de la release.
      - name: recopier template/
        if: ${{ steps.token.outputs.present == 'true' }}
        working-directory: starter
        run: |
          set -euo pipefail
          rsync -a --delete --exclude .git ../tool/template/ ./
          find . -path ./.git -prune -o -type f -exec perl -pi -e "s/__SCALINGO_WATCHER_TAG__/$TAG/g" {} +
          if grep -rq --exclude-dir=.git __SCALINGO_WATCHER_TAG__ .; then
            echo "::error::repere de version encore present apres remplacement"
            exit 1
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "$TEMPLATE_REPOSITORY deja a jour"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: synchroniser avec scalingo-watcher $TAG"
          git push
