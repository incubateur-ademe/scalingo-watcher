# Declencheurs et permissions de la reconciliation, dont la logique vit dans le
# workflow reutilisable de scalingo-watcher.
#
# Le push sur le manifeste et le cron restent commentes jusqu'a la derniere
# etape de l'installation (README.md) : une reconciliation deploie, et le
# manifeste doit d'abord decrire le parc reel, dans un ordre relu.
name: reconcilier le parc

on:
  # Fusionner une pull request declenche la convergence tout de suite, au lieu
  # d'attendre le prochain creneau. Le filtre sur le manifeste evite la boucle :
  # le commit de lock que ce workflow produit lui-meme ne le declencherait pas.
  # push:
  #   branches: [main]
  #   paths:
  #     - manifest.yaml
  # Declare a l'heure, execute en pratique toutes les trois a six heures :
  # GitHub ne garantit pas ses crons et saute des creneaux. Un passage a vide
  # coute moins d'une minute.
  # schedule:
  #   - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Relever et comparer sans rien deployer
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    uses: incubateur-ademe/scalingo-watcher/.github/workflows/reconcile.yml@__SCALINGO_WATCHER_TAG__
    with:
      environment: production
      # Le cron et le push n'ont pas d'inputs : la comparaison ramene leur
      # valeur absente a false.
      dry_run: ${{ inputs.dry_run == true }}
      # Notification Matrix (Tchap compris), facultative. Le jeton du compte bot
      # va dans le secret MATRIX_ACCESS_TOKEN de l'environment.
      # matrix-homeserver: https://matrix.agent.<domaine>.tchap.gouv.fr
      # matrix-room-id: "!xxxxxxxx:agent.<domaine>.tchap.gouv.fr"
    # Chaque secret est mappe, meme range dans l'environment : le job appele ne
    # lit la valeur de l'environment que pour un secret que l'appelant lui passe.
    # Un secret absent arrive vide.
    secrets:
      FGP_KEY: ${{ secrets.FGP_KEY }}
      SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
      TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
