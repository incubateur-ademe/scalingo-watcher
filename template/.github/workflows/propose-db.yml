# Proposition des montees de version des bases pilotees, en pull request.
#
# Le cron reste commente jusqu'a la derniere etape de l'installation
# (README.md), comme celui de la reconciliation. Sans PUSH_TOKEN, la pull
# request est ouverte avec le GITHUB_TOKEN et ne declenche pas la validation.
name: proposer les montees de base

on:
  # schedule:
  #   - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    uses: incubateur-ademe/scalingo-watcher/.github/workflows/propose-db.yml@v1.0.4 # x-release-please-version
    with:
      environment: production
    # Chaque secret est mappe, meme range dans l'environment : le job appele ne
    # lit la valeur de l'environment que pour un secret que l'appelant lui passe.
    # Un secret absent arrive vide.
    secrets:
      FGP_KEY: ${{ secrets.FGP_KEY }}
      SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
